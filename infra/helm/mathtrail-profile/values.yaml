replicaCount: 1

image:
  repository: mathtrail-profile
  tag: latest

service:
  port: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

migration:
  enabled: true
  command: ["/migrate"]

externalSecrets:
  enabled: false
  vaultPath: ""
  keys: []

rollout:
  enabled: false
  strategy: ""
  steps: []
  autoPromotionEnabled: true

# Vault Database Config Job — deprecated, replaced by VCO DatabaseSecretEngineConfig CR.
# DB engine config is now managed centrally via infra/vault-config/profile-api/.
vaultDbConfig:
  enabled: false
  connectionName: "profile-postgres"
  pgDatabase: "profile"
  roleName: "profile-api-role"

# Vault Secrets Operator — creates and rotates the mathtrail-profile-db-secret K8s Secret.
vso:
  enabled: true
  vaultRole: "profile-api"
  dbRole: "profile-api-role"
  secretName: "mathtrail-profile-db-secret"
