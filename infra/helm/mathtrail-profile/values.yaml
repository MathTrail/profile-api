replicaCount: 1

image:
  repository: mathtrail-profile
  tag: latest

service:
  port: 8080

dapr:
  enabled: true
  appId: "mathtrail-profile"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

migration:
  enabled: true
  command: ["/migrate"]

externalSecrets:
  enabled: false
  vaultPath: ""
  keys: []

rollout:
  enabled: false
  strategy: ""
  steps: []
  autoPromotionEnabled: true

# Vault Database Config Job — creates DB connection + dynamic role in Vault.
vaultDbConfig:
  enabled: false
  connectionName: "profile-postgres"
  pgDatabase: "profile"
  roleName: "profile-api-role"
