db:
  databases:
    - name: profile
      vaultPrivileges: true

replicaCount: 1

image:
  repository: mathtrail-profile
  tag: latest

service:
  port: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

migration:
  enabled: true
  command: ["/migrate"]

externalSecrets:
  enabled: false
  vaultPath: ""
  keys: []

rollout:
  enabled: false
  strategy: ""
  steps: []
  autoPromotionEnabled: true

# Vault Config Operator CRs — deployed as part of this Helm chart into vault-config-operator ns.
# Configures the Vault Database Engine connection and role for dynamic credential generation.
vaultConfig:
  enabled: true
  db:
    connectionName: "profile-postgres"
    database: "profile"
    roleName: "profile-api-role"
  k8sAuth:
    serviceAccount: "mathtrail-profile"
    namespace: "mathtrail"

# Vault Database Config Job — deprecated.
vaultDbConfig:
  enabled: false
  connectionName: "profile-postgres"
  pgDatabase: "profile"
  roleName: "profile-api-role"

# Vault Secrets Operator — creates and rotates the mathtrail-profile-db-secret K8s Secret.
vso:
  enabled: true
  vaultRole: "profile-api"
  dbRole: "profile-api-role"
  secretName: "mathtrail-profile-db-secret"
