apiVersion: v1
kind: Service
metadata:
  # Named profile-postgres-pgbouncer — used as PG_HOST by profile-api.
  name: profile-postgres-pgbouncer
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: profile-pgbouncer
    app.kubernetes.io/part-of: mathtrail
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    app.kubernetes.io/name: profile-pgbouncer
  ports:
    - name: pgbouncer
      port: 6432
      targetPort: 6432
